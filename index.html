<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore AI Readiness Quiz</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const SingaporeAIQuiz = () => {
          const [currentQuestion, setCurrentQuestion] = useState(0);
          const [answers, setAnswers] = useState([]);
          const [showResult, setShowResult] = useState(false);
          const [showStats, setShowStats] = useState(false);
          const [showDetailedStats, setShowDetailedStats] = useState(false);
          const [scores, setScores] = useState({ unaware: 0, curious: 0, experimenter: 0, integrator: 0, champion: 0 });
          const [startTime, setStartTime] = useState(null);
          const [sessionId] = useState(() => 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));

          // Initialize session tracking
          useEffect(() => {
            const now = new Date();
            setStartTime(now);
            
            // Track session start
            const sessionData = {
              sessionId,
              startTime: now.toISOString(),
              userAgent: navigator.userAgent,
              screenSize: `${window.screen.width}x${window.screen.height}`,
              timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            
            trackEvent('session_start', sessionData);
          }, []);

          // Track events
          const trackEvent = (eventType, data = {}) => {
            const events = JSON.parse(localStorage.getItem('sg_ai_quiz_events') || '[]');
            const event = {
              sessionId,
              eventType,
              timestamp: new Date().toISOString(),
              data
            };
            events.push(event);
            
            // Keep only last 1000 events to prevent storage bloat
            if (events.length > 1000) {
              events.splice(0, events.length - 1000);
            }
            
            localStorage.setItem('sg_ai_quiz_events', JSON.stringify(events));
          };

          // Load statistics from localStorage
          const loadStats = () => {
            const saved = localStorage.getItem('sg_ai_quiz_stats');
            if (saved) {
              return JSON.parse(saved);
            }
            return {
              total: 0,
              completed: 0,
              unaware: 0,
              curious: 0,
              experimenter: 0,
              integrator: 0,
              champion: 0,
              totalTime: 0,
              questionDropoffs: Array(10).fill(0),
              answerCounts: {}
            };
          };

          // Save result to statistics
          const saveResult = (resultType) => {
            const stats = loadStats();
            const completionTime = startTime ? (new Date() - startTime) / 1000 : 0;
            
            stats.total += 1;
            stats.completed += 1;
            stats[resultType] += 1;
            stats.totalTime += completionTime;
            
            localStorage.setItem('sg_ai_quiz_stats', JSON.stringify(stats));
            
            // Track completion
            trackEvent('quiz_completed', {
              resultType,
              completionTime,
              answers: answers.length
            });
          };

          const questions = [
            {
              id: 1,
              question: "Your colleague at the next desk mentions using ChatGPT to help draft emails. Your first thought?",
              options: [
                { text: "Wah, what is ChatGPT? Is it safe to use?", points: { unaware: 3, curious: 1 } },
                { text: "Interesting leh, maybe I should check it out", points: { curious: 3, experimenter: 1 } },
                { text: "Ya lor, I use it sometimes for work also", points: { experimenter: 3, integrator: 1 } },
                { text: "I can show you better prompting techniques!", points: { integrator: 2, champion: 3 } },
                { text: "I'm already training our whole department on it", points: { champion: 3 } }
              ]
            },
            {
              id: 2,
              question: "During lunch at the hawker center, your kakis are discussing Singapore's Smart Nation initiatives. You:",
              options: [
                { text: "Listen quietly - not really sure what they're talking about", points: { unaware: 3 } },
                { text: "Ask questions to understand better", points: { curious: 3, experimenter: 1 } },
                { text: "Share your experience using government digital services", points: { experimenter: 2, integrator: 2 } },
                { text: "Explain how AI is being used in these initiatives", points: { integrator: 3, champion: 1 } },
                { text: "Lead the discussion about future implications for our industry", points: { champion: 3 } }
              ]
            },
            {
              id: 3,
              question: "Your boss asks you to research productivity tools for the team. You:",
              options: [
                { text: "Google 'productivity software' and see what comes up", points: { unaware: 2, curious: 2 } },
                { text: "Ask around for recommendations from colleagues", points: { curious: 3, experimenter: 1 } },
                { text: "Compare several AI-powered tools you've heard about", points: { experimenter: 3, integrator: 1 } },
                { text: "Present a comprehensive analysis of AI tools with ROI projections", points: { integrator: 2, champion: 3 } },
                { text: "Propose a pilot program with multiple tools and training plan", points: { champion: 3 } }
              ]
            },
            {
              id: 4,
              question: "On the MRT to work, you see an ad for an AI course. Your reaction:",
              options: [
                { text: "Blur blur, not sure if it's relevant to me", points: { unaware: 3 } },
                { text: "Screenshot to research later", points: { curious: 3, experimenter: 1 } },
                { text: "Compare it with other courses you're considering", points: { experimenter: 3, integrator: 1 } },
                { text: "Already enrolled in several AI courses this year", points: { integrator: 2, champion: 2 } },
                { text: "Teaching similar content at your company", points: { champion: 3 } }
              ]
            },
            {
              id: 5,
              question: "Your company implements a new AI chatbot for HR queries. You:",
              options: [
                { text: "Prefer to call HR directly - don't trust the bot", points: { unaware: 3 } },
                { text: "Try it once or twice for simple questions", points: { curious: 2, experimenter: 2 } },
                { text: "Use it regularly and help colleagues learn too", points: { experimenter: 2, integrator: 3 } },
                { text: "Provide feedback to improve the bot's responses", points: { integrator: 2, champion: 3 } },
                { text: "Volunteer to help train other departments on it", points: { champion: 3 } }
              ]
            },
            {
              id: 6,
              question: "A client mentions they're using AI in their business. Your response:",
              options: [
                { text: "Nod politely but don't really understand what they mean", points: { unaware: 3 } },
                { text: "Ask them to explain more about their experience", points: { curious: 3, experimenter: 1 } },
                { text: "Share your own company's AI experiments", points: { experimenter: 2, integrator: 2 } },
                { text: "Discuss industry best practices and potential challenges", points: { integrator: 3, champion: 1 } },
                { text: "Offer to collaborate on AI initiatives", points: { champion: 3 } }
              ]
            },
            {
              id: 7,
              question: "Your team needs to analyze a large dataset for a presentation. You suggest:",
              options: [
                { text: "Manually go through it in Excel like always", points: { unaware: 3 } },
                { text: "Maybe we can find some online tool to help?", points: { curious: 3, experimenter: 1 } },
                { text: "Use an AI tool you've been experimenting with", points: { experimenter: 3, integrator: 1 } },
                { text: "Combine multiple AI tools for comprehensive analysis", points: { integrator: 2, champion: 3 } },
                { text: "Build a custom AI workflow for this type of analysis", points: { champion: 3 } }
              ]
            },
            {
              id: 8,
              question: "Singapore announces new AI regulations for businesses. You:",
              options: [
                { text: "Hope it doesn't affect your work much", points: { unaware: 3 } },
                { text: "Make a mental note to read about it sometime", points: { curious: 3, experimenter: 1 } },
                { text: "Research how it impacts your current AI tool usage", points: { experimenter: 2, integrator: 2 } },
                { text: "Brief your team on compliance requirements", points: { integrator: 3, champion: 1 } },
                { text: "Lead your organization's compliance strategy", points: { champion: 3 } }
              ]
            },
            {
              id: 9,
              question: "At a networking event, someone asks about your experience with AI at work. You:",
              options: [
                { text: "Honestly say you haven't really explored it yet", points: { unaware: 2, curious: 2 } },
                { text: "Share that you're just starting to learn about it", points: { curious: 3, experimenter: 1 } },
                { text: "Describe specific tools you use and their benefits", points: { experimenter: 3, integrator: 1 } },
                { text: "Discuss your company's AI implementation strategy", points: { integrator: 2, champion: 3 } },
                { text: "Exchange contact details to continue the AI conversation", points: { champion: 3 } }
              ]
            },
            {
              id: 10,
              question: "Your ideal weekend learning activity would be:",
              options: [
                { text: "Taking a break from all things tech", points: { unaware: 3 } },
                { text: "Watching YouTube videos about AI basics", points: { curious: 3, experimenter: 1 } },
                { text: "Trying out a new AI tool for personal projects", points: { experimenter: 3, integrator: 1 } },
                { text: "Attending an AI meetup or workshop in Singapore", points: { integrator: 2, champion: 2 } },
                { text: "Speaking at an AI event or writing about AI trends", points: { champion: 3 } }
              ]
            }
          ];

          const results = {
            unaware: {
              title: "The Steady Traditionalist",
              subtitle: "Building your AI foundation",
              description: "You're focused on mastering your current role and may not have had much exposure to AI yet. That's completely normal! Singapore's multicultural workplace has room for everyone to learn at their own pace.",
              strengths: "Strong foundational skills, careful approach to new technology, valuable institutional knowledge",
              nextSteps: "Start with basic AI literacy through SkillsFuture courses. Try simple tools like Grammarly or Google Translate to get comfortable with AI assistance.",
              timeframe: "3-6 months to become AI Curious",
              localTips: "Check out IMDA's Digital Skills for Life framework (https://www.imda.gov.sg/how-we-can-help/digital-for-life) and attend workshops at the 37 SG Digital community hubs across Singapore."
            },
            curious: {
              title: "The Interested Explorer", 
              subtitle: "Ready to dive deeper",
              description: "You're aware of AI's potential and eager to learn more. Your curiosity is your superpower! You're asking the right questions and ready to take the next step.",
              strengths: "Growth mindset, willingness to learn, good at identifying opportunities",
              nextSteps: "Try ChatGPT or Google Bard for work tasks. Join AI meetups like Singapore AI Developers Group (https://www.meetup.com/singapore-ai-developers-group) or attend Singapore Youth AI meetups.",
              timeframe: "3-6 months to become AI Experimenter", 
              localTips: "Explore SkillsFuture AI courses (https://www.myskillsfuture.gov.sg) and connect with AI Singapore's community through AI4SME platform (https://ai4sme.aisingapore.org)."
            },
            experimenter: {
              title: "The Practical Pioneer",
              subtitle: "Getting hands-on with AI",
              description: "You're actively using AI tools and seeing real benefits in your work. You understand both the potential and the limitations - very kiasu in the best way!",
              strengths: "Practical application skills, balanced perspective, early adopter mindset",
              nextSteps: "Master advanced features of your current tools, learn prompt engineering, and start mentoring curious colleagues. Take structured courses through SkillsFuture-approved training providers.",
              timeframe: "6-12 months to become AI Integrator",
              localTips: "Join professional AI communities like AI Tinkerers Singapore (https://singapore.aitinkerers.org) and consider AI governance training through Singapore's Model AI Governance Framework (https://www.imda.gov.sg/how-we-can-help/model-ai-governance-framework)."
            },
            integrator: {
              title: "The Connected Catalyst",
              subtitle: "Leading AI adoption",
              description: "You're not just using AI - you're helping others adopt it too. Your colleagues see you as the go-to person for AI questions. You're building bridges between technology and people.",
              strengths: "Leadership abilities, systems thinking, excellent mentoring skills",
              nextSteps: "Lead cross-departmental AI initiatives, develop training programs, and contribute to your organization's AI strategy.",
              timeframe: "12-18 months to become AI Champion",
              localTips: "Consider advanced certifications from Institutes of Higher Learning (IHL), explore TechSkills Accelerator programs (https://www.imda.gov.sg/how-we-can-help/techskills-accelerator), and engage with Singapore's AI governance frameworks."
            },
            champion: {
              title: "The Innovation Leader",
              subtitle: "Shaping Singapore's AI future",
              description: "You're not just using AI - you're transforming how your organization and industry thinks about it. You're helping to shape Singapore's Smart Nation vision through your expertise.",
              strengths: "Visionary thinking, change management, thought leadership",
              nextSteps: "Drive industry standards, speak at conferences, mentor other organizations, and contribute to AI policy development.",
              timeframe: "Continuous learning and innovation",
              localTips: "Connect with AI Singapore's research initiatives (https://aisingapore.org), apply for the AI Apprenticeship Programme (https://aiap.sg), and contribute to Singapore's AI ecosystem through the National AI Strategy 2.0."
            }
          };

          const handleAnswer = (option) => {
            const newAnswers = [...answers, option];
            setAnswers(newAnswers);
            
            // Track answer selection
            trackEvent('answer_selected', {
              questionIndex: currentQuestion,
              questionText: questions[currentQuestion].question,
              answerText: option.text,
              answerIndex: questions[currentQuestion].options.indexOf(option)
            });
            
            // Update answer counts in stats
            const stats = loadStats();
            const questionKey = `q${currentQuestion}`;
            if (!stats.answerCounts[questionKey]) {
              stats.answerCounts[questionKey] = {};
            }
            const answerKey = `option_${questions[currentQuestion].options.indexOf(option)}`;
            stats.answerCounts[questionKey][answerKey] = (stats.answerCounts[questionKey][answerKey] || 0) + 1;
            localStorage.setItem('sg_ai_quiz_stats', JSON.stringify(stats));
            
            const newScores = { ...scores };
            Object.keys(option.points).forEach(level => {
              newScores[level] += option.points[level];
            });
            setScores(newScores);

            if (currentQuestion < questions.length - 1) {
              setCurrentQuestion(currentQuestion + 1);
            } else {
              // Calculate result
              const maxScore = Math.max(...Object.values(newScores));
              const resultType = Object.keys(newScores).find(key => newScores[key] === maxScore);
              saveResult(resultType);
              setTimeout(() => setShowResult(resultType), 500);
            }
          };

          const resetQuiz = () => {
            // Track abandonment if not completed
            if (!showResult && currentQuestion > 0) {
              const stats = loadStats();
              stats.questionDropoffs[currentQuestion] += 1;
              localStorage.setItem('sg_ai_quiz_stats', JSON.stringify(stats));
              
              trackEvent('quiz_abandoned', {
                questionIndex: currentQuestion,
                answersCompleted: answers.length
              });
            }
            
            setCurrentQuestion(0);
            setAnswers([]);
            setShowResult(false);
            setShowStats(false);
            setShowDetailedStats(false);
            setScores({ unaware: 0, curious: 0, experimenter: 0, integrator: 0, champion: 0 });
            setStartTime(new Date());
            
            trackEvent('quiz_restarted');
          };

          const shareResult = () => {
            const result = results[showResult];
            const text = `I just discovered I'm "${result.title}" in AI readiness! 🚀 What's your AI kiasu level?`;
            
            trackEvent('result_shared', {
              resultType: showResult,
              shareMethod: navigator.share ? 'native' : 'clipboard'
            });
            
            if (navigator.share) {
              navigator.share({ text });
            } else {
              navigator.clipboard.writeText(text);
              alert('Result copied to clipboard!');
            }
          };

          const toggleStats = () => {
            setShowStats(!showStats);
            trackEvent('stats_toggled', { showing: !showStats });
          };

          const toggleDetailedStats = () => {
            setShowDetailedStats(!showDetailedStats);
            trackEvent('detailed_stats_toggled', { showing: !showDetailedStats });
          };

          const getAnalytics = () => {
            const events = JSON.parse(localStorage.getItem('sg_ai_quiz_events') || '[]');
            const stats = loadStats();
            
            // Calculate completion rate
            const sessionsStarted = events.filter(e => e.eventType === 'session_start').length;
            const completionRate = sessionsStarted > 0 ? Math.round((stats.completed / sessionsStarted) * 100) : 0;
            
            // Calculate average completion time
            const avgTime = stats.completed > 0 ? Math.round(stats.totalTime / stats.completed) : 0;
            
            // Peak usage analysis
            const hourCounts = {};
            const dayCounts = {};
            events.forEach(event => {
              const date = new Date(event.timestamp);
              const hour = date.getHours();
              const day = date.toLocaleDateString('en-SG', { weekday: 'long' });
              hourCounts[hour] = (hourCounts[hour] || 0) + 1;
              dayCounts[day] = (dayCounts[day] || 0) + 1;
            });
            
            const peakHour = Object.keys(hourCounts).reduce((a, b) => hourCounts[a] > hourCounts[b] ? a : b, '0');
            const peakDay = Object.keys(dayCounts).reduce((a, b) => dayCounts[a] > dayCounts[b] ? a : b, 'Monday');
            
            // Drop-off analysis
            const totalDropoffs = stats.questionDropoffs.reduce((a, b) => a + b, 0);
            const maxDropoffIndex = stats.questionDropoffs.indexOf(Math.max(...stats.questionDropoffs));
            
            return {
              sessionsStarted,
              completionRate,
              avgTime,
              peakHour,
              peakDay,
              totalDropoffs,
              maxDropoffQuestion: maxDropoffIndex + 1,
              maxDropoffCount: stats.questionDropoffs[maxDropoffIndex]
            };
          };

          const StatsDisplay = () => {
            const stats = loadStats();
            if (stats.total === 0) return null;

            const getPercentage = (count) => Math.round((count / stats.completed) * 100);

            return (
              <div className="bg-blue-50 p-4 rounded-lg mt-4">
                <h3 className="font-semibold text-blue-800 mb-3 flex items-center gap-2">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                  </svg>
                  Community Results ({stats.completed} completed)
                </h3>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span>Steady Traditionalists:</span>
                    <span className="font-medium">{getPercentage(stats.unaware)}% ({stats.unaware})</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Interested Explorers:</span>
                    <span className="font-medium">{getPercentage(stats.curious)}% ({stats.curious})</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Practical Pioneers:</span>
                    <span className="font-medium">{getPercentage(stats.experimenter)}% ({stats.experimenter})</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Connected Catalysts:</span>
                    <span className="font-medium">{getPercentage(stats.integrator)}% ({stats.integrator})</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Innovation Leaders:</span>
                    <span className="font-medium">{getPercentage(stats.champion)}% ({stats.champion})</span>
                  </div>
                </div>
                
                <button 
                  onClick={toggleDetailedStats}
                  className="mt-3 text-blue-600 text-sm hover:text-blue-800 underline"
                >
                  {showDetailedStats ? 'Hide' : 'Show'} Detailed Analytics
                </button>
                
                {showDetailedStats && <DetailedStatsDisplay />}
              </div>
            );
          };

          const DetailedStatsDisplay = () => {
            const analytics = getAnalytics();
            const stats = loadStats();
            
            return (
              <div className="mt-4 pt-4 border-t border-blue-200">
                <h4 className="font-semibold text-blue-800 mb-3">📊 Detailed Analytics</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                  <div className="space-y-2">
                    <div className="flex justify-between">
                      <span>Sessions Started:</span>
                      <span className="font-medium">{analytics.sessionsStarted}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Completion Rate:</span>
                      <span className="font-medium">{analytics.completionRate}%</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Avg. Time:</span>
                      <span className="font-medium">{Math.floor(analytics.avgTime / 60)}m {analytics.avgTime % 60}s</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Peak Usage:</span>
                      <span className="font-medium">{analytics.peakDay}s, {analytics.peakHour}:00</span>
                    </div>
                  </div>
                  <div className="space-y-2">
                    <div className="flex justify-between">
                      <span>Total Drop-offs:</span>
                      <span className="font-medium">{analytics.totalDropoffs}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Most Difficult Q:</span>
                      <span className="font-medium">#{analytics.maxDropoffQuestion} ({analytics.maxDropoffCount} drops)</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Retakes:</span>
                      <span className="font-medium">{stats.total - analytics.sessionsStarted}</span>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          if (showResult) {
            const result = results[showResult];
            return (
              <div className="max-w-2xl mx-auto p-6 bg-gradient-to-br from-red-50 to-orange-50 min-h-screen">
                <div className="bg-white rounded-lg shadow-lg p-8">
                  <div className="text-center mb-6">
                    <div className="w-20 h-20 bg-gradient-to-r from-red-500 to-orange-500 rounded-full mx-auto mb-4 flex items-center justify-center">
                      <span className="text-3xl">🚀</span>
                    </div>
                    <h2 className="text-3xl font-bold text-gray-800 mb-2">{result.title}</h2>
                    <p className="text-lg text-gray-600">{result.subtitle}</p>
                  </div>
                  
                  <div className="space-y-6">
                    <div>
                      <h3 className="font-semibold text-gray-800 mb-2">Your AI Journey</h3>
                      <p className="text-gray-600">{result.description}</p>
                    </div>
                    
                    <div>
                      <h3 className="font-semibold text-gray-800 mb-2">Your Strengths</h3>
                      <p className="text-gray-600">{result.strengths}</p>
                    </div>
                    
                    <div>
                      <h3 className="font-semibold text-gray-800 mb-2">Next Steps</h3>
                      <p className="text-gray-600">{result.nextSteps}</p>
                    </div>
                    
                    <div>
                      <h3 className="font-semibold text-gray-800 mb-2">Timeline</h3>
                      <p className="text-gray-600">{result.timeframe}</p>
                    </div>
                    
                    <div className="bg-red-50 p-4 rounded-lg">
                      <h3 className="font-semibold text-red-800 mb-2">Singapore-Specific Tips</h3>
                      <p className="text-red-700">{result.localTips}</p>
                    </div>
                  </div>
                  
                  <div className="flex gap-4 mt-8">
                    <button 
                      onClick={resetQuiz}
                      className="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2"
                    >
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="1,4 1,10 7,10"></polyline>
                        <path d="M3.51,15a9,9,0,0,0,2.13,9.36,4,4,0,0,0,7.74,0A9,9,0,0,0,20.49,15"></path>
                      </svg>
                      Retake Quiz
                    </button>
                    <button 
                      onClick={shareResult}
                      className="flex-1 bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2"
                    >
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                      </svg>
                      Share Result
                    </button>
                  </div>
                  
                  <div className="mt-4">
                    <button 
                      onClick={toggleStats}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                    >
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                      </svg>
                      {showStats ? 'Hide' : 'Show'} Community Results
                    </button>
                    {showStats && <StatsDisplay />}
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="max-w-2xl mx-auto p-6 bg-gradient-to-br from-red-50 to-orange-50 min-h-screen">
              <div className="bg-white rounded-lg shadow-lg p-8">
                {currentQuestion === 0 && (
                  <div className="text-center mb-8">
                    <h1 className="text-4xl font-bold bg-gradient-to-r from-red-600 to-orange-600 bg-clip-text text-transparent mb-4">
                      What's Your AI Kiasu Level?
                    </h1>
                    <p className="text-lg text-gray-600 mb-2">Singapore AI Readiness Quiz</p>
                    <p className="text-gray-500">Discover your AI journey in the Smart Nation context</p>
                  </div>
                )}
                
                <div className="mb-6">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-sm font-medium text-gray-600">
                      Question {currentQuestion + 1} of {questions.length}
                    </span>
                    <span className="text-sm text-gray-500">
                      {Math.round(((currentQuestion + 1) / questions.length) * 100)}% Complete
                    </span>
                  </div>
                  <div className="w-full bg-gray-200 rounded-full h-2">
                    <div 
                      className="bg-gradient-to-r from-red-500 to-orange-500 h-2 rounded-full transition-all duration-300"
                      style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                    ></div>
                  </div>
                </div>
                
                <div className="mb-8">
                  <h2 className="text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                    {questions[currentQuestion].question}
                  </h2>
                  
                  <div className="space-y-3">
                    {questions[currentQuestion].options.map((option, index) => (
                      <button
                        key={index}
                        onClick={() => handleAnswer(option)}
                        className="w-full text-left p-4 rounded-lg border border-gray-200 hover:border-red-300 hover:bg-red-50 transition-all duration-200 group"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-gray-700 group-hover:text-red-700">
                            {option.text}
                          </span>
                          <svg className="text-gray-400 group-hover:text-red-500 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <polyline points="9,18 15,12 9,6"></polyline>
                          </svg>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
                
                <div className="text-center text-sm text-gray-500">
                  <p>🇸🇬 Designed for Singapore's multicultural workplace</p>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<SingaporeAIQuiz />, document.getElementById('root'));
    </script>
</body>
</html>
